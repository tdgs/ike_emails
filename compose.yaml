# Local S3 for development: SeaweedFS with its S3 API on http://127.0.0.1:8333,
# reachable from this machine only. It is 127.0.0.1 and not localhost, as some
# Docker setups reset connections to the IPv6 address localhost may resolve to.
# Credentials are in dev/seaweedfs-s3.json and config/dev.exs.
services:
  s3:
    image: chrislusf/seaweedfs:4.06
    command: server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - s3-data:/data
      - ./dev/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro

volumes:
  s3-data:
