# Deployed with Kamal (https://kamal-deploy.org) to a single VPS: the app and its
# Postgres run there as containers. Secrets are not in this file, see
# .kamal/secrets.
service: ike-emails
image: tdgs/ike-emails

servers:
  web:
    hosts:
      - 91.250.248.6
    # Migrations run on every start. If one fails the container exits, the
    # health check fails and Kamal keeps the previous version running.
    cmd: sh -c "bin/migrate && exec bin/server"

proxy:
  ssl: true
  host: app.ikeops.gr
  app_port: 4000
  healthcheck:
    path: /up
    interval: 3
    timeout: 3

registry:
  server: ghcr.io
  username: tdgs
  password:
    - KAMAL_REGISTRY_PASSWORD

ssh:
  user: deploy

builder:
  arch: amd64
<% if ENV["KAMAL_BUILD_ON_SERVER"] %>
  # Build on the server itself. On an Apple Silicon Mac the amd64 build runs
  # under emulation, where Erlang crashes on start. Set by `make deploy`. The
  # GitHub Action does not set it: its runner is amd64 and builds the image itself.
  remote: ssh://deploy@91.250.248.6
<% end %>


deploy_timeout: 60

env:
  clear:
    PHX_HOST: app.ikeops.gr
    POOL_SIZE: "10"
    # The Elorus API keys that are unlocked are in the memory of the server, and
    # a crash dump of the VM would hold them: it is not written
    ERL_CRASH_DUMP_BYTES: "0"
    # The invoice PDFs are in a Cloudflare R2 bucket, which takes the region "auto"
    S3_BUCKET: ike-email-pdfs
    AWS_REGION: auto
    # The bucket is in the EU jurisdiction. The endpoint has no bucket in it, the
    # app adds that.
    AWS_ENDPOINT_URL_S3: https://b3558df98013686d5554e48c46b5721e.eu.r2.cloudflarestorage.com
    #
    # Optional integrations, see config/runtime.exs. The secret ones also need
    # to be listed under secret below and defined in .kamal/secrets. The business
    # and the Elorus account are those of each user, set in the app at /settings.
    AI_MODEL: anthropic:claude-sonnet-5-5
  secret:
    - SECRET_KEY_BASE
    # Seals the Elorus API keys of the users, which are in the database. Without it
    # the container does not start, and a new one makes them enter their keys again
    - SETTINGS_ENCRYPTION_KEY
    - DATABASE_URL
    - BANK_API_TOKEN
    - AWS_ACCESS_KEY_ID
    - AWS_SECRET_ACCESS_KEY
    - ANTHROPIC_API_KEY
    # Where the errors are reported to, off without it
    - SENTRY_DSN

accessories:
  # Backed up nightly to R2 by a systemd timer on the server, which is not part
  # of Kamal. See deploy/backup/setup.sh.
  db:
    image: postgres:17
    host: 91.250.248.6
    # Only reachable from the server itself, not from the internet. Docker
    # publishes ports around ufw, so the 127.0.0.1 here is what keeps it closed.
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_USER: ike_emails
        POSTGRES_DB: ike_emails_prod
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data
